'$schema': 'http://json-schema.org/draft-04/schema#'
'$id': 'https://raw.githubusercontent.com/umccr/orcabus/main/docs/schemas/events/sequencerunmanager/SequenceRunStateChange.schema.json'
description: EventBridge custom event schema for orcabus.sequencerunmanager@SequenceRunStateChange
title: AWSEvent
type: object
required:
  - detail-type
  - detail
  - source
properties:
  id:
    type: string
  region:
    type: string
  resources:
    type: array
    items:
      type: string
  source:
    type: string
  time:
    type: string
    format: date-time
  version:
    type: string
  account:
    type: string
  detail-type:
    type: string
  detail:
    '$ref': '#/definitions/SequenceRunStateChange'
definitions:
  SequenceRunStateChange:
    type: object
    required:
      - id
      - version
      - orcabusId
      - instrumentRunId
      - runVolumeName
      - runFolderPath
      - runDataUri
      - sampleSheetName
      - startTime
      - status
    properties:
      id:
        # unique id for the data event, e.g. the hashed event data, useful for deduplication.
        # (This is supposed to only change if the event payload has changed)
        # NOTE: independent of the AWS event id, and since schema version 1.1.0 no longer
        # the OrcaBus id of the Sequence - use `orcabusId` for that.
        type: string
      version:
        # the version associated with the event schema version (following semver)
        type: string
      orcabusId:
        # the OrcaBus internal id of the Sequence, e.g. seq.01234EXAMPLE567SEQUENCERUN
        type: string
      instrumentRunId:
        type: string
      runVolumeName:
        type: string
      runFolderPath:
        type: string
      runDataUri:
        type: string
      sampleSheetName:
        type:
          - string
          - 'null'
      startTime:
        type: string
        format: date-time
      endTime:
        type:
          - string
          - 'null'
        format: date-time
      status:
        # the current/new state of the Sequence that the event announces
        type: string
      stateCreatedBy:
        # normalized email of the user who created this sequence-run state;
        # omitted for system-generated states (e.g. BSSH driven) that have no author
        type: string
